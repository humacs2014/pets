name: build-macos-dmg

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # 允许workflow自动创建Release挂DMG公开下载链接

jobs:
  build:
    runs-on: macos-15   # Apple Silicon runner → arm64版DMG（M1及以上MacBook）
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt5==5.15.10 pyinstaller==6.11.1

      - name: Generate .icns app icon (sips为macOS自带，无需PIL)
        run: |
          mkdir -p app.iconset
          sips -z 16 16     icon.png --out app.iconset/icon_16x16.png
          sips -z 32 32     icon.png --out app.iconset/icon_16x16@2x.png
          sips -z 32 32     icon.png --out app.iconset/icon_32x32.png
          sips -z 64 64     icon.png --out app.iconset/icon_32x32@2x.png
          sips -z 128 128   icon.png --out app.iconset/icon_128x128.png
          sips -z 256 256   icon.png --out app.iconset/icon_128x128@2x.png
          sips -z 256 256   icon.png --out app.iconset/icon_256x256.png
          sips -z 512 512   icon.png --out app.iconset/icon_256x256@2x.png
          sips -z 512 512   icon.png --out app.iconset/icon_512x512.png
          sips -z 1024 1024 icon.png --out app.iconset/icon_512x512@2x.png
          iconutil -c icns app.iconset -o app.icns

      - name: Build .app bundle
        run: |
          set -o pipefail
          python -m PyInstaller --version
          python -m PyInstaller husky_mac.spec --noconfirm --clean 2>&1 | tee pyinstaller.log

      - name: Push build log on failure（失败时日志推到ci-logs分支，公开可读）
        if: failure()
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout -B ci-logs
          git add -f pyinstaller.log
          git commit -m "CI: build failure log" || true
          git push -f origin ci-logs

      - name: Package DMG
        run: |
          rm -rf dmg_stage
          mkdir dmg_stage
          cp -R "dist/哈士奇桌面宠物.app" dmg_stage/
          ln -s /Applications dmg_stage/Applications
          hdiutil create -volname "哈士奇桌面宠物" -srcfolder dmg_stage -ov -format UDZO "HuskyPet-v27-macOS-arm64.dmg"

      - name: Verify DMG
        run: |
          hdiutil verify "HuskyPet-v27-macOS-arm64.dmg"
          ls -lh *.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: husky-macos-dmg
          path: "HuskyPet-v27-macOS-arm64.dmg"
          retention-days: 30

      - name: Cleanup previous release（重建干净的Release）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete v27-macos-arm64 --yes --cleanup-tag 2>/dev/null || true

      - name: Create Release（公开下载链接，朋友无需登录即可下载）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v27-macos-arm64
          name: "哈士奇桌面宠物 v27 (macOS arm64)"
          body: |
            macOS版安装包，适用于Apple Silicon（M1/M2/M3/M4）MacBook。
            首次打开：右键点击应用→选择"打开"→再点"打开"。
            若提示"已损坏"：终端执行 xattr -cr /Applications/哈士奇桌面宠物.app
          files: "HuskyPet-v27-macOS-arm64.dmg"

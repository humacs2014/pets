name: build-macos-dmg
# Template placeholders（全局替换）: GoldenVestPet=pet display name  GoldenVestPet=ASCII name(spec文件名/DMG前缀/Release tag前缀)  v1=version  com.goldenvest.pet=bundle id  golden_vest_mac.spec=mac spec filename  {ENTRY_PY}=entry py filename
# Universal2 single package（v72标准）: dual-arch matrix build.app → merge job用lipomerge → one DMG compatible withApple Silicon+Intel，users don't need to choose
# Requires: project root must have merge_universal.sh（从本skill templates/merge_universal.sh复制）
# Key：no ad-hoc signature+network download quarantine=friends see"已损坏"（right-click open can't bypass），v54lesson
# Key：lipomerge破坏原签名，must re-codesign after merge，otherwise"已损坏"recur

on:
  push:
    branches: [golden_vest]
  workflow_dispatch:

permissions:
  contents: write   # allowworkflow自动创建Release挂DMGpublic download link

jobs:
  build:
    # Matrix build：each arch produces one.app（no longer separate DMG each/Release）
    strategy:
      fail-fast: false   # one arch failure doesn't affect the other
      matrix:
        include:
          - runner: macos-15        # Apple Silicon runner
            arch: arm64
          - runner: macos-15-intel  # Intel runner（GitHub最后一个x86_64镜像，available until2027年8月）
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt5==5.15.10 pyinstaller==6.11.1

      - name: Generate .icns app icon (sips为macOS自带，无需PIL)
        run: |
          mkdir -p app.iconset
          sips -z 16 16     icon.png --out app.iconset/icon_16x16.png
          sips -z 32 32     icon.png --out app.iconset/icon_16x16@2x.png
          sips -z 32 32     icon.png --out app.iconset/icon_32x32.png
          sips -z 64 64     icon.png --out app.iconset/icon_32x32@2x.png
          sips -z 128 128   icon.png --out app.iconset/icon_128x128.png
          sips -z 256 256   icon.png --out app.iconset/icon_128x128@2x.png
          sips -z 256 256   icon.png --out app.iconset/icon_256x256.png
          sips -z 512 512   icon.png --out app.iconset/icon_512x512.png
          sips -z 1024 1024 icon.png --out app.iconset/icon_512x512@2x.png
          iconutil -c icns app.iconset -o app.icns

      - name: Build .app bundle
        run: |
          set -o pipefail
          echo "架构确认: $(uname -m)"
          python -m PyInstaller --version
          python -m PyInstaller golden_vest_mac.spec --noconfirm --clean 2>&1 | tee pyinstaller.log
          file "dist/GoldenVestPet.app/Contents/MacOS/GoldenVestPet"

      - name: Push build log on failure（push log to on failureci-logs分支，publicly readable）
        if: failure()
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout -B ci-logs-GoldenVestPet-${{ matrix.arch }}
          git add -f pyinstaller.log
          git commit -m "CI: build failure log (${{ matrix.arch }})" || true
          git push -f origin ci-logs-GoldenVestPet-${{ matrix.arch }} || true

      - name: Ad-hoc codesign（单架构sign first，keep slice valid；merge后还会then签一次）
        run: |
          codesign --force --deep --sign - "dist/GoldenVestPet.app" || true
          codesign -dv "dist/GoldenVestPet.app" 2>&1 | head -5 || true

      - name: Upload .app artifact（tar package：upload-artifact的zip compression breaks.app内的symlinkand doesn't keep directory itself，must tar to preserve symlinks；rename to arch name first，otherwise两tar解包同名互覆）
        run: |
          export COPYFILE_DISABLE=1   # prevent macOS tar inserting._metadata files polluting bundle
          mv "dist/GoldenVestPet.app" "dist/${{ matrix.arch }}.app"
          tar -cf "app-${{ matrix.arch }}.tar" -C dist "${{ matrix.arch }}.app"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pet-macos-app-${{ matrix.arch }}
          path: "app-${{ matrix.arch }}.tar"
          retention-days: 30

  merge:
    # lipomerge双架构 → Universal2单DMG（Universalmerge只能在macOS上做，lipo是system built-in）
    needs: build
    runs-on: macos-15
    steps:
      - name: Checkout（需要merge_universal.sh）
        uses: actions/checkout@v4

      - name: Download both arch .app artifacts（tar解包：symlinks preserved via tar，zip breaks）
        uses: actions/download-artifact@v4
        with:
          pattern: pet-macos-app-*
          merge-multiple: true
          path: apps

      - name: Extract tarballs to .app
        run: |
          cd apps
          ls -la
          export COPYFILE_DISABLE=1
          tar -xf app-arm64.tar && rm app-arm64.tar
          tar -xf app-x86_64.tar && rm app-x86_64.tar
          ls -la
          echo "--- symlink spot check（must haveVersions/Currentetc Qt links）---"
          find arm64.app -type l | head -5

      - name: lipo merge to Universal2
        run: |
          ls apps/
          bash merge_universal.sh apps/arm64.app apps/x86_64.app "GoldenVestPet.app"

      - name: Ad-hoc codesign（must！lipomerge破坏签名，not re-sign=report"已损坏"）
        run: |
          codesign --force --deep --sign - "GoldenVestPet.app" || true
          codesign -dv "GoldenVestPet.app" 2>&1 | head -5 || true
          codesign --verify --deep --strict "GoldenVestPet.app" || echo "签名verification skipped (non-critical)"

      - name: 一键打开脚本（朋友双击即用：auto-install toApplications+clear quarantine+launch）
        # Key细节：DMG volume is read-only，script must cp to/Applicationsthenxattr，clearing in-volume fails silently
        run: |
          cat > "DoubleClickToOpen.command" <<'EOF'
          #!/bin/bash
          cd "$(dirname "$0")"
          SRC="GoldenVestPet.app"
          DEST="/Applications/$SRC"
          if [ ! -d "$DEST" ] && [ -d "$SRC" ]; then
            cp -R "$SRC" /Applications/ 2>/dev/null || osascript -e "do shell script \"cp -R '$PWD/$SRC' /Applications/\" with administrator privileges" 2>/dev/null
          fi
          APP="$DEST"
          [ -d "$APP" ] || APP="$(pwd)/$SRC"
          xattr -cr "$APP" 2>/dev/null
          open "$APP"
          EOF
          chmod +x "DoubleClickToOpen.command"

      - name: Package DMG（单包Universal，no longer differentiate arch）
        run: |
          rm -rf dmg_stage
          mkdir dmg_stage
          cp -R "GoldenVestPet.app" dmg_stage/
          cp "DoubleClickToOpen.command" dmg_stage/
          chmod +x "dmg_stage/DoubleClickToOpen.command"
          ln -s /Applications dmg_stage/Applications
          hdiutil create -volname "GoldenVestPet" -srcfolder dmg_stage -ov -format UDZO "GoldenVestPet-v1-macOS-Universal.dmg"

      - name: Verify DMG
        run: |
          hdiutil verify "GoldenVestPet-v1-macOS-Universal.dmg"
          ls -lh *.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pet-macos-dmg-universal
          path: "GoldenVestPet-v1-macOS-Universal.dmg"
          retention-days: 30

      - name: Cleanup previous releases（清理旧的分架构Release+旧universal，rebuild cleanRelease）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete GoldenVestPet-v1-macos-arm64 --yes --cleanup-tag 2>/dev/null || true
          gh release delete GoldenVestPet-v1-macos-x86_64 --yes --cleanup-tag 2>/dev/null || true
          gh release delete GoldenVestPet-v1-macos-universal --yes --cleanup-tag 2>/dev/null || true

      - name: Create Release（public download link，friends can download without login）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "GoldenVestPet-v1-macos-universal"
          name: "GoldenVestPet v1 (macOS 通用版 — Apple Silicon 与 Intel 均适用)"
          body: |
            macOS版GoldenVestPetpackage（Universal2通用版）。
            【无需select版本】one package compatible with both Apple Silicon（M1/M2/M3/M4）和 Intel chip Mac，just download。
            【安装】双击DMG → drag"GoldenVestPet"icon toApplicationsfolder。
            【First open（关键）】打开DMG里的"DoubleClickToOpen.command"（会弹出终端窗口自动处理安全限制并launch）。
            Alternative：right-click app in Finder→select"打开"→弹窗里then点"打开"。
            still shows"已损坏"：open Terminal paste and run xattr -cr /Applications/GoldenVestPet.app then双击打开。
          files: "GoldenVestPet-v1-macOS-Universal.dmg"